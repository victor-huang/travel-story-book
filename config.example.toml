# Travel Story Book configuration. Copy to config.toml and edit.
# Every value shown is the default -- delete anything you don't want to change.

config_version = 1

# Name for this trip. Defaults to the source folder name.
# trip_name = "Europe 2026"

# Skip every network call. The pipeline still completes, just without landmark names.
no_cloud = false

# Media within exclusion_km of here is flagged and kept out of all exports.
# Strongly recommended: leaking your home address into a shared album is the failure
# mode that actually matters.
# [home]
# lat = 37.7749
# lon = -122.4194
# exclusion_km = 5.0

[time]
# A day runs from this hour to this hour, so a late night belongs to the evening it began.
day_start_hour = 4
# Warn (never split) if the media contains a gap this large -- usually means two trips
# were passed in one folder.
suspicious_gap_days = 3.0
# Last-resort timezone when EXIF has no offset and there is no GPS anywhere nearby.
default_timezone = "UTC"
# Refuse to interpolate a location across a time gap larger than this.
gps_interpolation_window_minutes = 120.0

[events]
# Start a new event after this long without a photo...
gap_minutes = 90.0
# ...or after moving this far from the running centroid.
jump_km = 1.5
min_items = 2

[dedup]
# Tight threshold: near-exact duplicates and burst frames.
phash_max_distance = 6
burst_max_seconds = 3.0
# Looser threshold: semantically similar shots of the same subject.
similar_min_cosine = 0.92

[quality]
# Content classes never eligible to be a highlight.
reject_content_classes = ["screenshot", "receipt", "document"]
min_overall_for_highlight = 0.35

[quality.weights]
# The documented overall-score sum. Normalized at use, so these need not total 1.0.
sharpness = 0.40
exposure = 0.25
contrast = 0.15
face = 0.20

[selection]
highlights_per_event = 5
highlights_per_day = 10
# Minimum embedding distance between highlights, so you get five different shots of the
# castle rather than five near-identical facades.
diversity_min_distance = 0.15

[video]
# none | auto | all. auto = clips over transcribe_min_seconds that look like they contain speech.
transcribe = "auto"
transcribe_min_seconds = 10.0
whisper_model = "small"
keyframe_count = 5

[models]
clip_name = "ViT-B-32"
clip_pretrained = "laion2b_s34b_b79k"
clip_batch_size = 32
# auto | mps | cuda | cpu
device = "auto"

[geocode]
# Offline city/region lookup always works. Nominatim adds POI-level names but is
# rate-limited by its usage policy.
use_nominatim = false
nominatim_user_agent = "travel-story-book"
nominatim_min_interval_seconds = 1.1
coordinate_rounding_decimals = 4

[landmarks]
# none disables the only cloud stage. Set a provider to get landmark names.
provider = "none"
# model = "claude-opus-5"
images_per_request = 4
max_requests = 400
# Ask before spending more than this on a single run.
confirm_above_estimated_usd = 1.0
prompt_version = 1

# Per-device corrections, keyed by the EXIF model string. Use this when a camera's clock
# was never set to local time -- the pipeline warns when it detects a likely offset.
# [devices."ILCE-7M4"]
# clock_offset_minutes = -60
# default_timezone = "Europe/Vienna"
