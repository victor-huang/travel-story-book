[project]
name = "storybook-service"
version = "0.1.0"
description = "HTTP service that runs the story-book CLI for the iOS client"
requires-python = ">=3.12"
license = { text = "MIT" }

# The service's whole job is to run `story-book build`, so it depends on the pipeline as a path
# dependency rather than vendoring or reimplementing anything. `clip` is deliberately absent: it
# pulls torch and multiplies the image size, and its absence degrades the pipeline rather than
# breaking it -- which /ready reports rather than hides. Whether the deployed image should carry it
# is a cost question for the human (open question 17).
dependencies = [
    "travel-story-book[exif,geo,images,video]",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    # FastAPI's TestClient is httpx-backed. Tests drive the real ASGI app rather than calling
    # endpoint functions directly, so a routing or status-code mistake is visible.
    "httpx>=0.28",
]

[tool.uv.sources]
travel-story-book = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storybook_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
