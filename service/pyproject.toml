[project]
name = "storybook-service"
version = "0.1.0"
description = "HTTP service that runs the story-book CLI for the iOS client"
requires-python = ">=3.12"
license = { text = "MIT" }

# The service's whole job is to run `story-book build`, so it depends on the pipeline as a path
# dependency rather than vendoring or reimplementing anything. `clip` is deliberately absent: it
# pulls torch and multiplies the image size, and its absence degrades the pipeline rather than
# breaking it -- which /ready reports rather than hides. Whether the deployed image should carry it
# is a cost question for the human (open question 18 -- the comment said 17, which is the index).
dependencies = [
    "travel-story-book[exif,geo,images,video]",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # S3 is the object store (open question 15, answered). boto3 rather than a hand-rolled
    # signer: presigned PUT signatures are SigV4, and getting one subtly wrong fails at the
    # client with a message that blames the client.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    # FastAPI's TestClient is httpx-backed. Tests drive the real ASGI app rather than calling
    # endpoint functions directly, so a routing or status-code mistake is visible.
    "httpx>=0.28",
    # A real S3 API surface. `moto[server]` in particular, because a presigned URL is only proven
    # by a genuine HTTP PUT to it from outside botocore -- which is what the client does.
    # Never a real bucket, and never in CI (open question 15).
    "moto[s3,server]>=5.0",
]

[tool.uv.sources]
travel-story-book = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storybook_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
