name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool ffmpeg

      # fonts-noto-cjk is not optional here. Burned-in subtitles pick a font by what has to be
      # drawn, and with no CJK face installed the burn-in is *correctly* skipped -- which failed
      # 14 tests on Linux while macOS passed on its bundled Hiragino. The tested path is the one
      # a traveller uses, so CI installs the font rather than skipping the feature.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl ffmpeg fonts-noto-cjk

      # Pinned exactly: setup-uv publishes no floating v8/v9 major tag, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv python install 3.12
      # Everything except `clip`, which pulls torch and would dominate CI time. `images` is small
      # and keeps the OpenCV-based quality scoring under test here; needs_clip tests skip.
      - run: uv sync --extra images --extra exif --extra video --extra geo

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
