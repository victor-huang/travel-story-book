name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool ffmpeg

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv python install 3.12
      # Deliberately not --all-extras: the vision extra pulls torch, which would dominate
      # CI time. needs_clip tests skip here and are expected to run locally.
      - run: uv sync --extra exif --extra video

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
