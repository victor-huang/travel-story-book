[project]
name = "travel-story-book"
version = "0.1.0"
description = "Turn a folder of travel photos and videos into an organized, deduplicated trip story"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
# Heavy stages are opt-in so a clone stays cheap and CI stays fast.
vision = [
    "open-clip-torch>=2.30",
    "torch>=2.5",
    "opencv-python-headless>=4.10",
]
video = [
    "faster-whisper>=1.1",
]
exif = [
    "pyexiftool>=0.5.6",
]

[project.scripts]
story-book = "story_book.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "piexif>=1.1.3",
    "ruff>=0.8",
    "autoflake>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_book"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_exiftool: requires the exiftool binary on PATH",
    "needs_ffmpeg: requires the ffmpeg binary on PATH",
    "needs_clip: requires the CLIP model and torch",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
