[project]
name = "travel-story-book"
version = "0.1.0"
description = "Turn a folder of travel photos and videos into an organized, deduplicated trip story"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "timezonefinder>=6.5",
    # Used directly for image arrays, so declared directly rather than relied on transitively.
    "numpy>=2.0",
]

[project.optional-dependencies]
# Split deliberately. `images` is small (no torch) and carries the quality signals, so CI can
# install it and actually exercise that code; `clip` is the multi-hundred-megabyte half. Bundling
# them meant CI skipped both, and the OpenCV-based scoring went untested there -- which is where a
# calibration bug hid.
images = [
    "opencv-python-headless>=4.10",
]
clip = [
    "open-clip-torch>=2.30",
    "torch>=2.5",
]
# Convenience alias for a full local install.
vision = [
    "travel-story-book[images,clip]",
]
video = [
    "faster-whisper>=1.1",
]
exif = [
    "pyexiftool>=0.5.6",
]
# Offline reverse geocoding. Bundles its own city dataset and builds a k-d tree, so it needs no
# network -- which is what lets `--no-cloud` still produce place names.
geo = [
    "reverse-geocoder>=1.5.1",
]

[project.scripts]
story-book = "story_book.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "piexif>=1.1.3",
    "ruff>=0.8",
    # Validates trip.json against src/story_book/trip_schema.json in tests. A dev dependency,
    # not a runtime one: the schema is the artifact's published contract, and the pipeline that
    # writes it should not also be the thing that decides it is valid.
    "jsonschema>=4.23",
    "autoflake>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_book"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_exiftool: requires the exiftool binary on PATH",
    "needs_ffmpeg: requires the ffmpeg binary on PATH",
    "needs_clip: requires the CLIP model and torch",
    "needs_exiftool: requires the exiftool binary on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
